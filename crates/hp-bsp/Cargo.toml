[package]
name = "hp-bsp"
description = "Hardened reader and writer for Source engine BSP files (versions 19 to 21): lumps, game lumps, entity lump and pakfile."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
rayon.workspace = true
crc32fast = "1.5"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization", "encoder"] }

[package]
name = "hp-gma"
description = "Fast, thread safe reader and writer for Garry's Mod GMA addon archives, including legacy LZMA .bin files."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
memchr.workspace = true
crc32fast = "1.5"
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "inline-more"] }
serde_json = "1"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization"] }
rayon.workspace = true

[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization", "encoder"] }
